; ==============================================================================
; Configuración Canónica PHP 8.1 - 8.5 (QA Testing Blueprints - Estándar 11X)
; Seguridad por Diseño (DISA ASD STIG V6R5 & OWASP v4.2) y Alto Rendimiento
; ==============================================================================

[PHP]
; 1. Localización y Sintaxis
date.timezone = UTC
short_open_tag = Off

; 2. Ocultación y Manejo Seguro de Errores (Anti-Information Leakage)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; 3. Asignación de Memoria y Tiempos de Ejecución
memory_limit = 2048M
max_execution_time = 120
max_input_time = 120

; 4. Gestión de Subida de Archivos y POST (Valores Coherentes y Seguros)
file_uploads = On
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; 5. Protección de Entornos y Archivos
allow_url_fopen = On
allow_url_include = Off

; 6. Caché de Rutas del Sistema de Archivos
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Session]
; Gobernanza de Sesiones e Identidad (DISA APSC-DV-002250 / APSC-DV-002290)
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1440
session.sid_length = 48
session.sid_bits_per_character = 6

[opcache]
; Rendimiento y Soporte Obligatorio de Atributos PHP 8+ (Doctrine / Symfony / PHPStan)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1

; Compilador JIT (Aceleración de Análisis Estático y Pruebas de Mutación)
opcache.jit_buffer_size = 64M
opcache.jit = tracing
